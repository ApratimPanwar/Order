# Deploys the audited participant bundle to GitHub Pages.
#
# MANUAL ONLY. There is no push, pull_request or schedule trigger: an ordinary
# development push must never change what a participant is looking at, and a
# deployment during active collection must be a deliberate act (item 17).
#
# The workflow PUBLISHES a frozen release package. It never mints one and never
# regenerates stimuli: `expected_package_digest` is asserted against the bundle,
# so a run that would have deployed different content fails instead.
#
# Nothing researcher-side is uploaded. Only research/dist/participant/ — the
# output of scripts/build-participant-dist.mjs, which audits itself for the
# scoring key, condition labels, escaping imports and root-absolute URLs.

name: Deploy study site

on:
  workflow_dispatch:
    inputs:
      expected_package_digest:
        description: 'Full SHA-256 packageDigest that must be deployed (from study-private/release-package.json)'
        required: true
        type: string
      confirm:
        description: 'Type DEPLOY to confirm'
        required: true
        type: string
      release_mode:
        description: 'Release mode this deployment is expected to carry'
        required: true
        default: development
        type: choice
        options:
          - development
          - participant

# Least privilege. Write access to repository contents is deliberately absent:
# publishing must not be able to alter the repository. No token reaches the bundle.
permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deployment in flight; a half-replaced site is worse than a wait.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build the participant bundle
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: research
    steps:
      # Dispatch inputs reach the shell through the environment, never through
      # string interpolation into the script body.
      - name: Refuse an unconfirmed run
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "DEPLOY" ]; then
            echo "::error::confirm must be exactly DEPLOY"
            exit 1
          fi

      - uses: actions/checkout@v4

      # Pinned to the exact runtime the suite is tested on.
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'

      # No dependencies: the instrument is plain ES modules and node:test.
      - name: Show runtime
        run: node --version

      - name: Run the automated suite
        run: npm test

      - name: Run the specification verifier
        run: node scripts/verify-specification.mjs

      - name: Build and audit the participant bundle
        env:
          EXPECTED: ${{ inputs.expected_package_digest }}
        run: node scripts/build-participant-dist.mjs --expect-digest "$EXPECTED"

      - name: Assert the deployment matches what was requested
        run: |
          node -e '
            const fs = require("fs");
            const audit = JSON.parse(fs.readFileSync("results/participant-dist-audit.json", "utf8"));
            const expected = process.env.EXPECTED;
            const mode = process.env.MODE;
            const problems = [];
            if (!audit.clean) problems.push("bundle audit is not clean: " + JSON.stringify(audit.findings));
            if (audit.releasePackageDigest !== expected) {
              problems.push(`deployed digest ${audit.releasePackageDigest} != requested ${expected}`);
            }
            if (audit.releaseMode !== mode) {
              problems.push(`bundle release mode ${audit.releaseMode} != requested ${mode}`);
            }
            if (mode === "participant" && !audit.returnChannel) {
              problems.push("a participant release must carry an approved return channel");
            }
            if (!audit.files.includes("index.html")) problems.push("index.html is not at the artifact root");
            for (const f of audit.files) {
              if (/stimulus-key|study-private|approvals/i.test(f)) problems.push("forbidden file: " + f);
            }
            if (problems.length) { for (const p of problems) console.error("::error::" + p); process.exit(1); }
            console.log(`publishing ${audit.releasePackageId} [${audit.releaseMode}] - ${audit.fileCount} files`);
          '
        env:
          EXPECTED: ${{ inputs.expected_package_digest }}
          MODE: ${{ inputs.release_mode }}

      - name: Record what is being published
        run: |
          node -e '
            const a = require("./results/participant-dist-audit.json");
            const rows = Object.entries(a.assetDigests).map(([f, d]) => `| \`${f}\` | \`${d.slice(0, 16)}…\` |`);
            console.log([
              `### Publishing \`${a.releasePackageId}\``, "",
              `- mode: **${a.releaseMode}**`,
              `- package digest: \`${a.releasePackageDigest}\``,
              `- return channel: ${a.returnChannel ? a.returnChannel.kind : "**none specified**"}`,
              `- files: ${a.fileCount}`, "",
              "| file | sha256 |", "|---|---|", ...rows,
            ].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/configure-pages@v5

      # Only the audited bundle. Never the repository, never research/ wholesale.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: research/dist/participant

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    # A protected environment: required reviewers and branch restrictions are
    # configured on github-pages in repository settings.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
