# Publishes site/ to GitHub Pages for ApratimPanwar/order-study-site.
#
# MANUAL ONLY: no push, pull_request or schedule trigger, so an ordinary commit
# can never change what a participant is looking at during collection.
#
# This repository contains only the audited participant bundle and its manifest.
# The research source and its test suite are in ApratimPanwar/Order and ran
# before export; the manifest records the source commit. This workflow verifies
# that site/ is byte-for-byte what was audited, carries no researcher-only
# material, and has the frozen package digest that was requested.

name: Deploy study site

on:
  workflow_dispatch:
    inputs:
      expected_package_digest:
        description: 'Full SHA-256 packageDigest to publish'
        required: true
        type: string
      release_mode:
        description: 'Release mode the bundle must carry'
        required: true
        default: development
        type: choice
        options: [development, participant]
      confirm:
        description: 'Type DEPLOY to confirm'
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse an unconfirmed run
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "DEPLOY" ]; then echo "::error::confirm must be exactly DEPLOY"; exit 1; fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'

      - name: Verify the bundle against its manifest
        env:
          EXPECTED: ${{ inputs.expected_package_digest }}
          MODE: ${{ inputs.release_mode }}
        run: node tools/verify-site.mjs --expect-digest "$EXPECTED" --expect-mode "$MODE"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: verify
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
